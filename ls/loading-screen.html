<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anastasia's Winter Wonderland</title>
  <link rel="stylesheet" href="loading-screen.css">
</head>
<body>
  <main id="loading-screen" class="loading-screen">
    <section id="generic-state" class="generic-state" aria-label="Welcome">
      <h1 class="welcome-heading">Welcome to<br><span class="snow-text snow-blue">Anastasia's</span> <span class="snow-text snow-purple">Winter</span> <span class="snow-text snow-white">Wonderland</span><span class="welcome-title-emphasis">!</span></h1>
    </section>

    <section id="map-state" class="map-state" aria-label="Loading information">
      <aside class="map-panel">
        <div class="profile-block">
          <img id="profile-image" class="profile-image" src="" alt="Steam profile picture">
          <p id="player-name" class="player-name">Steam Player</p>
        </div>
        <div class="panel-rule"></div>
        <p class="panel-label">Map</p>
        <h2 id="map-name">Loading map</h2>
        <p class="game-mode">TTT | Anastasia's Winter Wonderland</p>
        <div class="panel-rule"></div>
        <p class="panel-label">How to play</p>
        <ul class="tutorial-list">
          <li><strong>W A S D</strong> Move</li>
          <li><strong>Mouse 1</strong> Fire or interact</li>
          <li><strong>Mouse 2</strong> Alternate fire</li>
          <li><strong>Q</strong> Drop your weapon</li>
          <li><strong>C</strong> Open the role shop</li>
          <li><strong>F3</strong> Open this menu</li>
          <li><strong>Tab</strong> View the scoreboard</li>
        </ul>
      </aside>
    </section>
  </main>
  <script src="loading-screen.js"></script>
</body>
</html>
